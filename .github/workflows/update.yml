name: Update data & deploy

# 코드는 main, 수집 데이터는 data 브랜치에 둔다.
# data 브랜치는 매번 커밋 하나로 덮어써서(force push) 저장소가 데이터 때문에 커지지 않는다.

on:
  schedule:
    - cron: '0 21 * * *' # 매일 06:00 KST — 전체 수집
    - cron: '0 3,9,15 * * *' # 12:00 · 18:00 · 00:00 KST — 기간 한정 무료만
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # 전체 수집: 매일 06시 스케줄과 수동 실행. 나머지 스케줄은 무료 목록만 (몇 초)
  FULL: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 21 * * *' }}
  # data 브랜치에 보관하는 경로
  DATA_PATHS: data public/data public/weekly

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore data
        run: |
          git fetch --depth=1 origin data:refs/remotes/origin/data
          git restore --source=origin/data --worktree -- $DATA_PATHS

      - name: Fetch Steam data
        if: github.event_name != 'push' && env.FULL == 'true'
        run: node scripts/update.mjs

      # 그 주(월요일 기준)의 글이 아직 없을 때만 새로 만든다
      - name: Weekly post
        if: github.event_name != 'push' && env.FULL == 'true'
        run: node scripts/weekly.mjs

      - name: Free games
        if: github.event_name != 'push'
        run: node scripts/free.mjs

      - name: Save data
        if: github.event_name != 'push'
        run: |
          if [ "$FULL" = "true" ]; then msg="data: $(TZ=Asia/Seoul date +%F) 갱신"; else msg="data: 무료 목록 $(TZ=Asia/Seoul date '+%F %H시')"; fi
          tmp=$(mktemp -d)
          cp -r --parents $DATA_PATHS "$tmp"
          cd "$tmp"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "$msg"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
